name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project ios/Vanity.xcodeproj \
            -scheme Vanity \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|warning: unre" build.log | sort -u | head -80; tail -60 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Vanity.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Vanity.ipa Payload
          ls -lh Vanity.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Vanity-ipa
          path: Vanity.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vanity.ipa
          generate_release_notes: true
          body_path: ios/RELEASE_NOTES.md

  screenshots:
    name: Simulator screenshots
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        run: |
          brew install xcodegen
          (cd ios && xcodegen generate)
          xcodebuild -project ios/Vanity.xcodeproj -scheme Vanity -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -60; exit 1; }

      - name: Capture screens
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Device $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Vanity.app
          mkdir -p shots
          for mode in light dark; do
            xcrun simctl ui "$DEVICE" appearance $mode
            for screen in library category record expiring editor settings; do
              xcrun simctl terminate "$DEVICE" dev.huichen.vanity || true
              xcrun simctl launch "$DEVICE" dev.huichen.vanity -VanityDemo YES -VanityDemoScreen $screen \
                -AppleLanguages "(zh-Hans)" -AppleLocale zh_CN
              sleep 6
              xcrun simctl io "$DEVICE" screenshot "shots/$mode-$screen.png"
            done
          done
          ls -l shots

      - uses: actions/upload-artifact@v5
        with:
          name: Vanity-screenshots
          path: shots
