name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project ios/Vanity.xcodeproj \
            -scheme Vanity \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|warning: unre" build.log | sort -u | head -80; tail -60 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Vanity.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Vanity.ipa Payload
          ls -lh Vanity.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Vanity-ipa
          path: Vanity.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vanity.ipa
          generate_release_notes: true
          body_path: ios/RELEASE_NOTES.md
